name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of @cycjimmy/h5-pages (or of your derived package) you are using.
      placeholder: 5.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Swiper version, Node.js/npm versions, OS, and the browser the problem shows up in.
      placeholder: |
        Swiper: 11
        Node.js: 24
        npm: 11
        OS: macOS 15
        Browser: WeChat 8.0 on iOS
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, or a minimal demo (repository / code sandbox) that shows the problem.
      placeholder: |
        1. Go to '...'
        2. Tap on '....'
        3. See error
      render: text
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: The `init()` call, the page classes, and the relevant part of your markup.
      render: text

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The browser or build log around the failure, if available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
